<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SafarBook — every car out, every rupee tracked. A KARYA studio build.">
  <title>SafarBook — every car out, every rupee tracked</title>

  <!-- board paper base -->
  <rect width="1200" height="630" fill="#F4F6FB"/>

  <!-- faint board rules -->
  <g stroke="#E2E8F2" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- blue accent band down the left, like a board margin -->
  <rect x="0" y="0" width="18" height="630" fill="#2563eb"/>
  <rect x="90" y="0" width="2" height="630" fill="#DBE4F7"/>

  <!-- logo mark -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="72" height="66" rx="8" fill="#2563eb"/>
    <rect x="0" y="0" width="19" height="66" rx="8" fill="#1d4ed8"/>
    <path d="M32 22h30M32 36h30M32 50h20" stroke="#EEF2FB" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F172A">Safar</tspan><tspan fill="#2563eb">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#0F172A">Every car out,</text>
  <text x="96" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#2563eb">every rupee tracked.</text>

  <!-- tagline -->
  <text x="98" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#475569">Trip booking, driver &amp; vehicle assignment and a daily dispatch board.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#2563eb"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#EEF2FB">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#475569">studio build · taxi &amp; travel · pricing on discovery</text>
  </g>

  <!-- mini dispatch chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFFFF" stroke="#CBD5E8" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Dispatch board</text>
    <rect x="236" y="24" width="56" height="26" rx="13" fill="#DBE4F7"/>
    <text x="264" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Live</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#475569">TRV-118 · Lonavala</text>
    <rect x="204" y="76" width="88" height="24" rx="12" fill="#15803D"/>
    <text x="248" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Completed</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="17" fill="#475569">TRV-124 · T2 airport</text>
    <rect x="164" y="116" width="128" height="24" rx="12" fill="#DBE4F7"/>
    <text x="228" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Needs a driver</text>

    <line x1="24" y1="156" x2="288" y2="156" stroke="#E2E8F2" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#475569">Balance out</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#C2410C">₹5,350</text>
  </g>
</svg>
